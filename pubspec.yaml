name: busalert
description: "BusAlert Cardiff - Crowdsourced bus delay prediction app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Firebase (no auth required)
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  cloud_functions: ^5.2.4

  # GPS tracking
  geolocator: ^13.0.2

  # Maps (OpenStreetMap via flutter_map)
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # Local storage
  shared_preferences: ^2.3.5

  # Connectivity / offline detection
  connectivity_plus: ^6.1.2

  # Date formatting
  intl: ^0.20.2

  # WiFi SSID scanning (for bus line detection)
  wifi_scan: 0.4.1+2

  # HTTP requests (for BODS API)
  http: ^1.2.0

  # XML parsing (for BODS SIRI-VM responses)
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - routes.txt
    - trips.txt
    - stops.txt
    - stop_times.txt
    - shapes.txt
    - calendar_dates.txt
